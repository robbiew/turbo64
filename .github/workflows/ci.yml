name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        # Version follows the ubuntu-latest image. If lint fails right after
        # an image update, suspect cppcheck version drift before real defects.
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Lint
        run: bash tools/lint.sh
      - name: Host tests
        run: bash tools/test.sh
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache oscar64
        id: cache-oscar64
        uses: actions/cache@v4
        with:
          path: vendor/oscar64
          key: oscar64-${{ hashFiles('tools/install-oscar64.sh') }}
      - name: Build oscar64
        if: steps.cache-oscar64.outputs.cache-hit != 'true'
        run: bash tools/install-oscar64.sh
      - name: Build PRGs
        run: make all
      - name: Build SoftIEC PRGs
        # The SIEC editor is memory-tight (~20 bytes free); a change to shared
        # HAL code that only grows the REL builds a little can still overflow
        # it. `make all` builds only the REL variants, so build the SIEC ones
        # too or an overflow reaches main unnoticed (it did once — a disk.c
        # change linked into CONFIGURE-SIEC).
        run: make c64-siec editor-siec
